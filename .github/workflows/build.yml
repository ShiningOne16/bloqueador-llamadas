name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew assembleRelease --console=plain 2>&1 | tee build.log; then
            # Muestra los errores como avisos en la página de la compilación
            grep -E "^e: |ERROR:|error:" build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk Bloqueador.apk

      - name: Verificar firma
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          $APKSIGNER verify --verbose Bloqueador.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Bloqueador-APK
          path: Bloqueador.apk

      # Publica el APK como descarga directa en la sección "Releases"
      - name: Publicar en Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Bloqueador ${{ github.run_number }}
          body: Descarga **Bloqueador.apk** e instálalo en tu teléfono (Android 10 o superior).
          files: Bloqueador.apk
          make_latest: true
