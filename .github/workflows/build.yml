name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK de prueba
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk Bloqueador.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Bloqueador-APK
          path: Bloqueador.apk

      # Publica el APK como descarga directa en la sección "Releases"
      - name: Publicar en Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Bloqueador ${{ github.run_number }}
          body: Descarga **Bloqueador.apk** e instálalo en tu teléfono (Android 10 o superior).
          files: Bloqueador.apk
          make_latest: true
