name = "bloqueador-spam"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Activar únicamente después de obtener un acuerdo de Tellows para esta app.
# La credencial se configura con wrangler secret put TELLOWS_APIKEY_MD5.
[vars]
TELLOWS_ENABLED = "false"
TELLOWS_LICENSE_APPROVED = "false"

# Los dos "REEMPLAZA…" salen de los comandos de cloudflare/README.md (pasos 3 y 4).
[[d1_databases]]
binding = "DB"
database_name = "bloqueador-spam"
database_id = "REEMPLAZA-CON-EL-ID-DE-D1"

[[kv_namespaces]]
binding = "LISTA"
id = "REEMPLAZA-CON-EL-ID-DE-KV"

# Cada 6 horas se publica la lista de spam y se limpian datos viejos.
[triggers]
crons = ["0 */6 * * *"]

